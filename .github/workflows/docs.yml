name: "Documentation"

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build DocC
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Generate combined DocC archive
        run: |
          swift package --allow-writing-to-directory docs-site \
            generate-documentation --target Logr --target LogrUI \
            --enable-experimental-combined-documentation \
            --transform-for-static-hosting --hosting-base-path Logr \
            --output-path docs-site
          # The archive root is the DocC-Render shell; send visitors to the module index instead.
          echo '<meta http-equiv="refresh" content="0; url=documentation/">' > docs-site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
