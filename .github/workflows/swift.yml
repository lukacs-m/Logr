name: "Swift Package CI"

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (macOS, Swift 6.3)
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Verify tools
        run: |
          xcodebuild -version
          swift --version

      - name: Lint (SwiftFormat, rules in .swiftformat)
        run: |
          brew install swiftformat
          swiftformat --lint .

      - name: Run tests
        run: swift test --parallel

      - name: Build documentation (warnings are errors)
        run: |
          swift package generate-documentation --target Logr --warnings-as-errors
          swift package generate-documentation --target LogrUI --warnings-as-errors

  platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS Simulator, tvOS Simulator, watchOS Simulator]
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      # xcodebuild, not `swift build --triple`: a triple forces Logr's deployment target onto every dependency,
      # and swift-perception's `Bindable` is obsoleted at exactly those versions.
      - name: Compile core and UI at their minimum deployment targets
        run: >-
          xcodebuild build
          -scheme LogrUI
          -destination 'generic/platform=${{ matrix.platform }}'
          -skipMacroValidation
          ARCHS=arm64
