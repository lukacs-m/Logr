name: "Swift Package CI"

on:
  push:
    branches: ["main", "develop", "feature/logr-2.0"]
  pull_request:
    branches: ["main", "develop", "feature/logr-2.0"]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test (macOS, Swift 6.3)
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Verify tools
        run: |
          xcodebuild -version
          swift --version

      # Pinned and checksummed: a new SwiftFormat release can change rules and fail unrelated PRs.
      # Bump the version, the checksum and `--minversion` in .swiftformat together.
      - name: Lint (SwiftFormat 0.63.1, rules in .swiftformat)
        env:
          SWIFTFORMAT_VERSION: 0.63.1
          SWIFTFORMAT_SHA256: 385ef1a263ba28685157b98c5536b9c9105e124518f28b7ef8a2bee4b167eaeb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  $RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          "$RUNNER_TEMP/swiftformat/swiftformat" --lint .

      - name: Run tests
        run: swift test --parallel

      - name: Build documentation (warnings are errors)
        run: |
          swift package generate-documentation --target Logr --warnings-as-errors
          swift package generate-documentation --target LogrUI --warnings-as-errors
          swift package generate-documentation --target LogrTesting --warnings-as-errors
          swift package generate-documentation --target LogrSwiftLog --warnings-as-errors
          swift package generate-documentation --target LogrNetwork --warnings-as-errors

  platforms:
    name: Build (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS Simulator, tvOS Simulator, watchOS Simulator]
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      # xcodebuild, not `swift build --triple`: a triple forces Logr's deployment target onto every dependency,
      # and swift-perception's `Bindable` is obsoleted at exactly those versions.
      - name: Compile every library at its minimum deployment target
        run: >-
          xcodebuild build
          -scheme Logr-Package
          -destination 'generic/platform=${{ matrix.platform }}'
          -skipMacroValidation
          ARCHS=arm64
